<meta name="author" content="Линза-симулятор">

<!-- Open Graph / Facebook / VK / Telegram -->
<meta property="og:title" content="Линза-симулятор — 3D-оптика: лучи, преломление, фокус">

<meta property="og:url" content="https://sermart.github.io/linz-simulator/">

<meta property="og:site_name" content="Линза-симулятор">

<!-- Twitter Card -->
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Линза-симулятор — симуляция преломления лучей">

<!-- Мобильные браузеры и тема -->

<meta name="apple-mobile-web-app-title" content="Линза-симулятор">

<meta name="mobile-web-app-capable" content="yes">

<!-- Google Fonts (оставлю, чтобы сохранить стиль как в примере, но можно убрать если мешает — не влияет на симулятор) -->
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">

<!-- Подключаем стили и скрипты исходного симулятора -->
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="top-menu">
    <div class="logo">⚡ OPTIC<span>LAB</span> · ЛИНЗЫ</div>
    <div class="buttons">
        <button onclick="addSource()">🔦 Лазер</button>
        <button onclick="addLens('converging')">🔵 Собирающая линза (С)</button>
        <button onclick="addLens('diverging')">🔴 Рассеивающая линза (Р)</button>
        <button onclick="addObstacle()">⬛ Преграда</button>
        <button onclick="clearAll()" class="btn-clear">🧹 Очистить всё</button>
    </div>
    <div class="edit-zone" id="edit-zone">
        <div class="placeholder">✨ выделите объект на сцене</div>
    </div>
</div>

<div class="info-panel">
    <div class="info-title">🔬 УПРАВЛЕНИЕ</div>
    <div>🖱️ Клик / Перетаскивание — двигать объект</div>
    <div>⚙️ Настройки появятся сверху после выбора элемента</div>
    <div>🔵 Собирающая (фокусирует лучи) | 🔴 Рассеивающая (разбрасывает)</div>
    <div>🔄 Колесико мыши или кольцо вокруг объекта — вращать</div>
</div>

<canvas id="labCanvas"></canvas>

<script src="script.js"></script>
</body>
</html>
